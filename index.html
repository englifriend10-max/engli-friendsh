:root{--blue:#2438d9;--ink:#10153d;--sun:#ffd84d;--paper:#f3f5ff;--card:#fff;--line:#d9ddf7;--muted:#5b6192;--red:#d6336c}
@media(prefers-color-scheme:dark){:root{--paper:#0e1130;--card:#181c4a;--line:#2e3490;--ink:#eef0ff;--muted:#a9afe6}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.5 Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
h1,h2,h3,button{font-family:Fredoka,system-ui,sans-serif}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:20px 16px 8px}
.view{display:none}.view.on{display:block}
.hero{background:var(--blue);color:#fff;border-radius:0 0 36px 36px;margin:-20px -16px 28px;padding:44px 24px 44px;text-align:center}
.hero h1{font-size:clamp(2.6rem,13vw,4rem);line-height:1;margin:0;letter-spacing:1px}
.hero h1 span{display:inline-block;background:var(--sun);color:var(--ink);padding:0 12px;border-radius:14px;transform:rotate(-3deg);margin-top:8px}
.hero p{margin:18px 0 0;font-size:1.1rem;opacity:.9}
.center{text-align:center}
.logo{display:block;background:var(--logo-img) center/112% no-repeat;border-radius:50%;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hero .logo{width:150px;height:150px;margin:0 auto 18px}
.bar .logo{width:44px;height:44px;box-shadow:none;flex:none}
button{cursor:pointer;border:0;border-radius:14px;font-size:1.05rem;font-weight:700;padding:14px 22px;min-height:48px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{background:var(--sun);color:#10153d;width:100%;box-shadow:0 4px 0 #c9a21a}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c9a21a}
.btn.big{font-size:1.5rem;padding:18px;max-width:280px}
.btn.alt{background:var(--blue);color:#fff;box-shadow:0 4px 0 #141f85}
.link{background:none;color:var(--blue);padding:8px 0;min-height:0;text-decoration:underline}
@media(prefers-color-scheme:dark){.link{color:var(--sun)}}
label{display:block;font-weight:700;margin:14px 0 4px}
input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:10px 0 0}
h2{margin:6px 0 4px;font-size:1.7rem}
.sub{color:var(--muted);margin:0 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar .link{font-size:.95rem}
.next{background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;margin:12px 0 18px;font-weight:700}
@media(prefers-color-scheme:dark){.next{background:var(--blue)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 10px}
.cell{display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
.tag{font-size:.68rem;line-height:1.1;text-align:center;color:var(--red);font-weight:700;min-height:1.5em;display:flex;align-items:flex-end;justify-content:center}
.day{width:100%;background:var(--blue);color:#fff;box-shadow:0 4px 0 #141f85;padding:14px 4px}
.day.locked{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.day.free{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c9a21a}
.pick{display:grid;gap:14px;margin:18px 0}
.pick button{font-size:1.6rem;padding:30px 10px}
.frame{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000;margin-top:12px}
.empty{color:var(--muted);font-style:italic}
.dayrow{border-top:2px solid var(--line);padding:12px 0}
.dayrow b{font-family:Fredoka}
.dayrow input{margin-top:6px;padding:10px 12px}
.dayrow button{margin-top:8px;padding:10px 16px;min-height:40px}
.list{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:.92rem}
footer{text-align:center;padding:18px}
footer button{background:none;color:var(--muted);font-size:.85rem;min-height:40px;padding:8px 18px}
#msg{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#msg.on{opacity:1}
</style>
</head>
<body>
<main>

<section id="landing" class="view on">
  <div class="hero"><div class="logo" role="img" aria-label="ENGLI FRIEND logo"></div><h1>ENGLI <span>FRIEND</span></h1><p>Learn &amp; Master English Grammar</p></div>
  <div class="center"><button class="btn big" onclick="startApp()">START</button></div>
</section>

<section id="login" class="view">
  <h2>Student login</h2>
  <p class="sub">Use the password the teacher sent you on WhatsApp.</p>
  <div class="panel">
    <label for="fName">Full name</label><input id="fName" autocomplete="name">
    <label for="fAddr">Address</label><input id="fAddr" autocomplete="street-address">
    <label for="fPlace">Place</label><input id="fPlace">
    <label for="fPass">Password</label><input id="fPass" type="password" autocomplete="current-password">
    <p class="err" id="loginErr"></p>
    <button class="btn" id="loginBtn" onclick="studentLogin()">START</button>
  </div>
  <button class="link" onclick="show('landing')">Back</button>
</section>

<section id="dash" class="view">
  <div class="bar"><div class="logo" aria-hidden="true"></div><h2 id="hello" style="flex:1;margin-left:10px">30-Day Course</h2><button class="link" onclick="logout()">Log out</button></div>
  <div class="next" id="nextBox"></div>
  <div class="grid" id="grid"></div>
</section>

<section id="lesson" class="view">
  <h2 id="lessonTitle"></h2>
  <div class="pick">
    <button class="btn alt" onclick="openItem('video')">CLASS</button>
    <button class="btn" onclick="openItem('work')">WORK</button>
  </div>
  <div id="lessonOut"></div>
  <button class="link" onclick="loadDash()">Back to Dashboard</button>
</section>

<section id="adminLogin" class="view">
  <h2>Teacher access</h2>
  <div class="panel">
    <label for="aPass">Admin password</label><input id="aPass" type="password">
    <p class="err" id="adminErr"></p>
    <button class="btn" onclick="adminLogin()">START</button>
  </div>
  <button class="link" onclick="show('landing')">Back</button>
</section>

<section id="adminDash" class="view">
  <div class="bar"><h2>Admin</h2><button class="link" onclick="adminOut()">Exit</button></div>
  <div class="panel">
    <h3 style="margin:0">Add a student</h3>
    <label for="sName">Full name</label><input id="sName">
    <label for="sPass">Password</label><input id="sPass">
    <p class="err" id="stuErr"></p>
    <button class="btn" onclick="addStudent()">Add student</button>
    <ul class="list" id="stuList"></ul>
  </div>
  <div class="panel">
    <h3 style="margin:0 0 4px">Course content</h3>
    <p class="sub">Paste a video link for CLASS and a worksheet or PDF link for WORK.</p>
    <div id="dayEdit"></div>
  </div>
</section>

</main>
<footer><button onclick="show('adminLogin')">ADMIN</button></footer>
<div id="msg" role="status"></div>

const DAY_MS = 24 * 3600 * 1000;
let user = null, timer = null, curDay = 0, lessonData = null, adminPw = "";

function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id));window.scrollTo(0,0);clearInterval(timer)}
function toast(t){const m=$("msg");m.textContent=t;m.classList.add("on");setTimeout(()=>m.classList.remove("on"),2200)}

async function studentLogin(){
  const name=$("fName").value.trim(), pass=$("fPass").value;
  if(!name||!pass||!$("fAddr").value.trim()||!$("fPlace").value.trim()){$("loginErr").textContent="Fill in all four fields.";return}
  $("loginBtn").disabled=true;$("loginErr").textContent="";
  const ok=await verify(name,pass,$("fAddr").value.trim(),$("fPlace").value.trim());
  $("loginBtn").disabled=false;
  if(!ok){$("loginErr").textContent="Name or password not found. Check with your teacher.";return}
  try{localStorage.setItem("engliUser",JSON.stringify({name,pass,start:user.start}))}catch(e){}
  loadDash();
}
async function verify(name,pass,addr="",place=""){
  const {data,error}=await db.rpc("student_login",{p_name:name,p_password:pass,p_address:addr,p_place:place});
  if(error)return "net";
  if(!data)return false;
  user={name,pass,start:new Date(data.start_at).getTime(),offset:new Date(data.now).getTime()-Date.now()};
  try{if(localStorage.getItem("engliUser"))localStorage.setItem("engliUser",JSON.stringify({name,pass,start:user.start}))}catch(e){}
  return true;
}
function logout(){localStorage.removeItem("engliUser");user=null;show("landing")}

async function loadDash(){
  let s=user,saved=null;
  try{saved=JSON.parse(localStorage.getItem("engliUser")||"null")}catch(e){}
  s=s||saved;
  if(!s)return show("landing");
  const r=await verify(s.name,s.pass);
  if(r==="net"){
    if(!saved||!saved.start)return show("landing");
    user={name:saved.name,pass:saved.pass,start:saved.start,offset:0};toast("Offline: showing saved progress");
  }else if(!r){logout();return show("login")}
  show("dash");$("hello").textContent="Hi, "+user.name.split(" ")[0];
  const g=$("grid");g.innerHTML="";
  for(let d=1;d<=30;d++){
    const c=document.createElement("div");c.className="cell";c.id="c"+d;g.appendChild(c)
  }
  tick();timer=setInterval(tick,1000);
}
function tick(){
  const now=Date.now()+user.offset;let nextAt=null;
  for(let d=1;d<=30;d++){
    const at=user.start+(d-1)*DAY_MS, open=now>=at, c=$("c"+d);
    if(!open&&nextAt===null)nextAt=at;
    const key=open?"o":"l";
    if(c.dataset.s===key)continue;
    c.dataset.s=key;
    c.innerHTML=open?`<button class="day ${d===1?"free":""}" onclick="openDay(${d})">Day ${d}</button>`
      :`<div class="tag">Locked for 24 hours</div><button class="day locked" disabled aria-label="Day ${d} locked">Day ${d}</button>`;
  }
  if(nextAt===null){$("nextBox").textContent="All 30 days are open. Keep going!";return}
  const s=Math.max(0,Math.ceil((nextAt-now)/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  $("nextBox").textContent=`Next day opens in ${h}h ${m}m ${s%60}s`;
}

async function openDay(d){
  const {data,error}=await db.rpc("get_lesson",{p_name:user.name,p_password:user.pass,p_day:d});
  if(error||!data){toast("This day is still locked.");return}
  curDay=d;lessonData=data;$("lessonTitle").textContent="Day "+d;$("lessonOut").innerHTML="";show("lesson");
}
function embedUrl(u){
  let m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);if(m)return"https://www.youtube.com/embed/"+m[1];
  m=u.match(/vimeo\.com\/(\d+)/);if(m)return"https://player.vimeo.com/video/"+m[1];
  m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);if(m)return"https://drive.google.com/file/d/"+m[1]+"/preview";
  return u;
}
function openItem(kind){
  const url=kind==="video"?lessonData.video_url:lessonData.work_url, out=$("lessonOut");
  if(!url){out.innerHTML='<p class="empty">Your teacher has not added this yet.</p>';return}
  const safe=encodeURI(url).replace(/"/g,"&quot;");
  if(kind==="video"){
    out.innerHTML=/\.(mp4|webm)(\?|$)/i.test(url)?`<video class="frame" controls src="${safe}"></video>`
      :`<iframe class="frame" src="${embedUrl(url)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
  }else{
    out.innerHTML=`<iframe class="frame" style="aspect-ratio:3/4" src="${embedUrl(url)}"></iframe>
      <p><a class="link" href="${safe}" target="_blank" rel="noopener">Open worksheet in a new tab</a></p>`;
  }
}

async function adminLogin(){
  const pw=$("aPass").value;
  if(pw!=="GrammarTeacher2026!"){$("adminErr").textContent="Wrong password.";return}
  const {data,error}=await db.rpc("admin_list",{p_admin:pw});
  if(error){$("adminErr").textContent="Server rejected the password.";return}
  adminPw=pw;$("aPass").value="";$("adminErr").textContent="";renderAdmin(data);show("adminDash");
}
function adminOut(){adminPw="";show("landing")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderAdmin(d){
  $("stuList").innerHTML=d.students.map(s=>`<li>${esc(s.name)}${s.start_at?" (started)":""}</li>`).join("")||"<li>No students yet.</li>";
  const map={};d.days.forEach(x=>map[x.day]=x);
  let h="";
  for(let i=1;i<=30;i++){const x=map[i]||{};
    h+=`<div class="dayrow"><b>Day ${i}</b>
      <input id="v${i}" placeholder="CLASS video URL" value="${esc(x.video_url)}">
         <input id="w${i}" placeholder="WORK worksheet / PDF URL" value="${esc(x.work_url)}">
      <button class="btn alt" onclick="saveDay(${i})">Save Day ${i}</button></div>`}
  $("dayEdit").innerHTML=h;
}
async function addStudent(){
  const n=$("sName").value.trim(),p=$("sPass").value.trim();
  if(!n||!p){$("stuErr").textContent="Enter a name and a password.";return}
  const {error}=await db.rpc("admin_add_student",{p_admin:adminPw,p_name:n,p_password:p});
  if(error){$("stuErr").textContent="Could not add: "+error.message;return}
  $("stuErr").textContent="";$("sName").value=$("sPass").value="";toast("Student added");refreshAdmin();
}
async function saveDay(i){
  const {error}=await db.rpc("admin_save_day",{p_admin:adminPw,p_day:i,p_video:$("v"+i).value.trim(),p_work:$("w"+i).value.trim()});
  toast(error?"Save failed":"Day "+i+" saved");
}
async function refreshAdmin(){const {data}=await db.rpc("admin_list",{p_admin:adminPw});if(data)$("stuList").innerHTML=data.students.map(s=>`<li>${esc(s.name)}${s.start_at?" (started)":""}</li>`).join("")}

async function startApp(){
  let saved=null;try{saved=localStorage.getItem("engliUser")}catch(e){}
  if(saved)await loadDash();else show("login");
}
</script>
</body>
